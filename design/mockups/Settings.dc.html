<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unred It settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#4D4D4D}a:hover{color:#222222}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAFAFA; color: #222222; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">
  <div style="height: 52px; display: flex; align-items: center; padding: 0 6px; border-bottom: 1px solid #E8E8E8; box-sizing: border-box; flex: none">
    <a href="Account.dc.html" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 10px 0 6px; color: #4D4D4D; font-size: 15px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Account
    </a>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 24px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.015em">Settings</h1>

    <section style="display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5E5E5E">Appearance</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 15px; font-weight: 500">Theme</div>
        <div role="group" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 3px; border-radius: 10px; background: #F0F0F0">
          <button type="button" aria-pressed="true" style="height: 38px; border: none; border-radius: 8px; background: #FAFAFA; box-shadow: 0 1px 2px rgba(17,18,20,0.12); color: #222222; font-size: 14px; font-weight: 600; cursor: pointer">Device</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: none; border-radius: 8px; background: none; color: #4D4D4D; font-size: 14px; font-weight: 500; cursor: pointer">Light</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: none; border-radius: 8px; background: none; color: #4D4D4D; font-size: 14px; font-weight: 500; cursor: pointer">Dark</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 15px; font-weight: 500">Feed view</div>
        <div role="group" aria-label="Feed view" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; padding: 3px; border-radius: 10px; background: #F0F0F0">
          <button type="button" aria-pressed="true" style="height: 38px; border: none; border-radius: 8px; background: #FAFAFA; box-shadow: 0 1px 2px rgba(17,18,20,0.12); color: #222222; font-size: 14px; font-weight: 600; cursor: pointer">Compact</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: none; border-radius: 8px; background: none; color: #4D4D4D; font-size: 14px; font-weight: 500; cursor: pointer">Cards</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 15px; font-weight: 500">Text size</div>
        <div role="group" aria-label="Text size" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; padding: 3px; border-radius: 10px; background: #F0F0F0">
          <button type="button" aria-pressed="true" style="height: 38px; border: none; border-radius: 8px; background: #FAFAFA; box-shadow: 0 1px 2px rgba(17,18,20,0.12); color: #222222; font-size: 14px; font-weight: 600; cursor: pointer">Default</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: none; border-radius: 8px; background: none; color: #4D4D4D; font-size: 15px; font-weight: 500; cursor: pointer">Large</button>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 16px; padding-top: 20px; border-top: 1px solid #E8E8E8">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5E5E5E">Filters</h2>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="hideSub" style="font-size: 15px; font-weight: 500">Hidden subreddits</label>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{subs}}" as="s" hint-placeholder-count="2">
            <span style="display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 2px 0 10px; border-radius: 16px; background: #F0F0F0; font-size: 13px; color: #222222">{{s.label}}
              <button type="button" aria-label="{{s.remove}}" style="width: 28px; height: 28px; border: none; background: none; color: #5E5E5E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </span>
          </sc-for>
        </div>
        <input id="hideSub" type="text" placeholder="Add a subreddit" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #D6D6D6; background: #FAFAFA; color: #222222; font-size: 15px; outline: none; box-sizing: border-box">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="hideWord" style="font-size: 15px; font-weight: 500">Hidden words</label>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{words}}" as="w" hint-placeholder-count="1">
            <span style="display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 2px 0 10px; border-radius: 16px; background: #F0F0F0; font-size: 13px; color: #222222">{{w.label}}
              <button type="button" aria-label="{{w.remove}}" style="width: 28px; height: 28px; border: none; background: none; color: #5E5E5E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </span>
          </sc-for>
        </div>
        <input id="hideWord" type="text" placeholder="Add a word or phrase" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #D6D6D6; background: #FAFAFA; color: #222222; font-size: 15px; outline: none; box-sizing: border-box">
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
        <span id="nsfwLabel" style="flex: 1; font-size: 15px; font-weight: 500">Hide NSFW posts</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="nsfwLabel" style="width: 46px; height: 28px; border-radius: 14px; border: none; background: #3A5F98; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer; flex: none; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FAFAFA; box-shadow: 0 1px 2px rgba(0,0,0,0.2)"></span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span id="seenLabel" style="font-size: 15px; font-weight: 500">Hide posts I have opened</span>
          <span style="font-size: 13px; color: #5E5E5E">They come back when you refresh the subreddit</span>
        </span>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="seenLabel" style="width: 46px; height: 28px; border-radius: 14px; border: none; background: #D6D6D6; padding: 3px; display: flex; justify-content: flex-start; cursor: pointer; flex: none; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FAFAFA; box-shadow: 0 1px 2px rgba(0,0,0,0.2)"></span></button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid #E8E8E8; font-size: 13px; line-height: 1.5; color: #5E5E5E">
      <div>Settings follow you to other devices through your Firefox account.</div>
      <div>Unred It collects no data. Version [x.y.z]</div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label) => ({ label: label, remove: 'Remove ' + label });
    return { subs: [chip('r/politics'), chip('r/funny')], words: [chip('spoiler')] };
  }
}
</script>
</body>
</html>
