<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unred It reader preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1a1a1a;
        }
      }
      /* The theme chosen in Settings (D-024), as on old.reddit.com. */
      html[data-unred-theme='dark'],
      html[data-unred-theme='dark'] body {
        background: #1a1a1a;
      }
      html[data-unred-theme='light'],
      html[data-unred-theme='light'] body {
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
